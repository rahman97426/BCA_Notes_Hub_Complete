 mcqs:[
  {q:"Which access specifier is used in a class definition by default?",opts:["Public","Protected","Private","Friend"],ans:2,exp:"Class members are PRIVATE by default. Struct members are PUBLIC. This is the primary syntax difference.",pyq:"2014, 2019"},
  {q:"The OOP characteristic that hides internal data from outside world is:",opts:["Abstraction","Encapsulation","Inheritance","Polymorphism"],ans:1,exp:"ENCAPSULATION hides data by bundling data+methods. Data Hiding makes members private — inaccessible from outside.",pyq:"2018"},
  {q:"An object is an ___ of a class.",opts:["Definition","Function","Instance","Structure"],ans:2,exp:"Object is an INSTANCE of a class. Class is the blueprint; object is the actual real-world entity created from it.",pyq:"2020"},
  {q:"By default, members of a struct are:",opts:["Private","Protected","Public","Friend"],ans:2,exp:"STRUCT members are PUBLIC by default. CLASS members are PRIVATE. This is the main difference in default access.",pyq:"2018"},
  {q:"Data hiding in OOP is achieved by declaring data members as:",opts:["public","protected","static","private"],ans:3,exp:"PRIVATE members cannot be accessed from outside the class — only through public methods. This is data hiding.",pyq:"2014"}
 ],
 short:[
  {q:"Explain the characteristics of OOP.",pyq:"2017, 2018, 2019 ★★★",marks:4,ans:"<h4>Definition</h4><p>OOP organizes programs around <strong>objects</strong> rather than procedures.</p><h4>Key Characteristics</h4><ul><li><strong>Encapsulation:</strong> Binding data + methods in one unit. Hides internal details.</li><li><strong>Data Hiding:</strong> Private members are inaccessible from outside. Protects data.</li><li><strong>Data Security:</strong> Prevents unauthorized access via access specifiers.</li><li><strong>Abstraction:</strong> Shows only necessary details, hides complexity.</li><li><strong>Inheritance:</strong> Derived class gets properties of base class. Code reuse.</li><li><strong>Polymorphism:</strong> Same name, different behavior in different contexts.</li></ul>"},
  {q:"What is the difference between a class and a structure?",pyq:"2018, 2020 ★★",marks:4,ans:"<h4>Key Differences</h4><ul><li><strong>Default Access:</strong> Class = private | Struct = public</li><li><strong>Default Inheritance:</strong> Class = private | Struct = public</li><li><strong>Usage:</strong> Class for full OOP; Struct for simple data grouping</li></ul><pre>struct S { int x; };  // x is public by default\nclass C { int x; };   // x is private by default</pre>"},
  {q:"What are private and public members of a class?",pyq:"2014",marks:4,ans:"<h4>Private Members</h4><p>Accessible <strong>only within the same class</strong>. Cannot be accessed from outside. Default in class.</p><h4>Public Members</h4><p>Accessible from <strong>anywhere</strong> in the program. Provide the interface to users.</p><pre>class Box {\n  private:\n    int length;\n  public:\n    void set(int l){ length=l; }\n    int get(){ return length; }\n};</pre>"}
 ],
 long:[
  {q:"Explain the Object-Oriented Programming paradigm with all its essential features.",pyq:"★★★★★ EVERY YEAR: 2014-2024",marks:12,ans:"<h4>Introduction</h4><p>OOP organizes software around <strong>objects</strong> rather than functions. C++ fully supports all OOP features.</p><h4>1. Class and Object</h4><p>Class is blueprint. Object is instance with its own data and methods.</p><h4>2. Encapsulation</h4><p>Binding data + methods in one unit. Access specifiers control visibility. Promotes data security.</p><h4>3. Data Abstraction</h4><p>Hiding internal implementation. User sees only interface. E.g., use cout without knowing its code.</p><h4>4. Data Hiding</h4><p>Private members inaccessible from outside. Protects data integrity.</p><h4>5. Inheritance</h4><p>Derived class acquires properties of base class. Promotes code reusability.</p><h4>6. Polymorphism</h4><p>Same name, different behavior. Compile-time: overloading. Runtime: virtual functions.</p><h4>7. Message Passing</h4><p>Objects communicate by calling member functions.</p><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass Student {\n  private:\n    int roll; string name;\n  public:\n    Student(int r,string n){roll=r;name=n;}\n    void display(){cout&lt;&lt;roll&lt;&lt;\" \"&lt;&lt;name&lt;&lt;endl;}\n};\nint main(){\n    Student s1(101,\"Sana\");\n    s1.display();\n    return 0;\n}</pre><h4>Conclusion</h4><p>OOP makes software development more manageable, reusable, and secure through its powerful features.</p>"},
  {q:"Explain the concept of class and object. How does an object differ from a variable?",pyq:"PYQ 2018, 2020",marks:12,ans:"<h4>Introduction</h4><p>Class and Object are the two fundamental building blocks of C++ OOP.</p><h4>Class</h4><p>A user-defined data type that groups data members and member functions. Blueprint for objects.</p><pre>class Car {\n  public:\n    string model;\n    int speed;\n    void show(){cout&lt;&lt;model&lt;&lt;\" \"&lt;&lt;speed;}\n};</pre><h4>Object</h4><p>An instance of a class. Memory allocated when object is created, not when class is defined.</p><pre>Car c1;            // Object created\nc1.model=\"Swift\"; // Access member\nc1.speed=120;\nc1.show();         // Call method</pre><h4>Object vs Variable</h4><ul><li>Variable: stores simple data | Object: stores data AND functions</li><li>Variable: predefined type | Object: user-defined class type</li><li>Objects support encapsulation; variables do not</li></ul><h4>Conclusion</h4><p>Class defines structure; object is the real entity. Objects are variables of class type with extra capabilities.</p>"}
 ]
},
{id:2,name:"Basics of C++",
 topics:"Structure of C++ Programs · Constructors · Destructors · cin/cout · Friend Functions · this Pointer · new/delete · Static Members · Inline Functions",
 mcqs:[
  {q:"cout stands for:",opts:["Class Output","Character Output","Console Output","Call Output"],ans:2,exp:"cout = Console OUTput. Object of ostream class. Similarly cin = Console INput (istream class).",pyq:"2018"},
  {q:"If a programmer does not provide a destructor, then ___ creates an empty one.",opts:["Linker","Compiler","Preprocessor","OS"],ans:1,exp:"COMPILER automatically generates a default constructor and destructor if not explicitly defined.",pyq:"2014"},
  {q:"Which of the following is NOT a member of a class?",opts:["Static function","Friend function","Const function","Virtual function"],ans:1,exp:"FRIEND function is declared inside class but is NOT a member. It can access private data without being a member.",pyq:"2014"},
  {q:"Which of the following cannot be declared static?",opts:["Class","Object","Functions","Data members"],ans:0,exp:"A CLASS itself cannot be declared static. Objects, data members, and member functions can all be declared static.",pyq:"2018"},
  {q:"The 'this' pointer refers to:",opts:["Base class object","Derived class object","Current object","Static object"],ans:2,exp:"'this' is a constant pointer that holds address of the CURRENT OBJECT. Available in all non-static member functions.",pyq:"2022"}
 ],
 short:[
  {q:"What is a constructor? Explain its characteristics.",pyq:"★★★★★ 2017,2018,2019,2020,2021",marks:4,ans:"<h4>Definition</h4><p>A <strong>constructor</strong> is a special member function automatically called when an object is created. Same name as class, no return type.</p><h4>Characteristics</h4><ul><li>Same name as the class</li><li>No return type (not even void)</li><li>Called automatically when object is created</li><li>Can be overloaded (multiple constructors allowed)</li><li>Cannot be declared virtual</li><li>If not defined, compiler provides default</li></ul><h4>Types</h4><ul><li><strong>Default:</strong> No parameters</li><li><strong>Parameterized:</strong> Takes arguments</li><li><strong>Copy:</strong> Takes reference to same class object</li></ul>"},
  {q:"What is a destructor? How does it differ from constructor?",pyq:"2014, 2018, 2022, 2024",marks:4,ans:"<h4>Definition</h4><p>A <strong>destructor</strong> is called automatically when object is destroyed. Performs cleanup (freeing memory).</p><h4>Syntax</h4><pre>~ClassName() { // cleanup code }</pre><h4>Constructor vs Destructor</h4><ul><li>Constructor: called on creation | Destructor: on destruction</li><li>Constructor: can have parameters | Destructor: no parameters</li><li>Constructor: can be overloaded | Destructor: cannot (only one)</li><li>Destructors called in REVERSE order of constructors</li></ul>"},
  {q:"What is a friend function? Why is it needed?",pyq:"★★★ 2014,2019,2021,2022,2024",marks:4,ans:"<h4>Definition</h4><p>A <strong>friend function</strong> is NOT a member of a class but is declared inside with keyword <code>friend</code>. It can access private and protected members.</p><h4>Why Needed</h4><ul><li>Access private data of two different classes simultaneously</li><li>Used for operator overloading (especially &lt;&lt; and &gt;&gt;)</li><li>Provides access without making data public</li></ul><pre>class Box {\n  private: int length;\n  public:\n    friend int area(Box b);\n};\nint area(Box b){ return b.length*2; }</pre>"}
 ],
 long:[
  {q:"Write a C++ program demonstrating all types of constructors and destructor.",pyq:"★★★★★ 2017,2018,2019,2020,2021,2024",marks:12,ans:"<h4>Introduction</h4><p>C++ has 3 constructor types: Default, Parameterized, Copy. Destructor performs cleanup on object destruction.</p><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass Student {\n    int roll; float marks;\npublic:\n    // Default Constructor\n    Student(){roll=0;marks=0.0;\n        cout&lt;&lt;\"Default called\\n\";}\n    // Parameterized Constructor\n    Student(int r,float m){roll=r;marks=m;\n        cout&lt;&lt;\"Param: Roll=\"&lt;&lt;r&lt;&lt;\"\\n\";}\n    // Copy Constructor\n    Student(const Student &s){roll=s.roll;marks=s.marks;\n        cout&lt;&lt;\"Copy called\\n\";}\n    void display(){\n        cout&lt;&lt;\"Roll:\"&lt;&lt;roll&lt;&lt;\" Marks:\"&lt;&lt;marks&lt;&lt;\"\\n\";}\n    // Destructor\n    ~Student(){\n        cout&lt;&lt;\"Destructor for \"&lt;&lt;roll&lt;&lt;\"\\n\";}\n};\nint main(){\n    Student s1;             // Default\n    Student s2(101,95.5f);  // Parameterized\n    Student s3(s2);         // Copy\n    s2.display();\n    s3.display();\n    return 0;\n}</pre><h4>Conclusion</h4><p>Constructors initialize objects. Copy constructor creates a copy. Destructor cleans up when object is destroyed.</p>"},
  {q:"Explain friend function with a complete C++ program.",pyq:"★★★ 2019,2021,2022,2024",marks:12,ans:"<h4>Introduction</h4><p>Friend function allows selective access to private data without making it public.</p><h4>Characteristics</h4><ul><li>Declared inside class with <code>friend</code> keyword, defined outside</li><li>NOT a class member — no <code>this</code> pointer</li><li>Can access private and protected members of the class</li></ul><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass Rectangle {\n    float length,width;\npublic:\n    Rectangle(float l,float w){length=l;width=w;}\n    friend float area(Rectangle r);\n    friend ostream&amp; operator&lt;&lt;(ostream&amp; o,Rectangle r);\n};\nfloat area(Rectangle r){\n    return r.length*r.width;\n}\nostream&amp; operator&lt;&lt;(ostream&amp; o,Rectangle r){\n    o&lt;&lt;r.length&lt;&lt;\"x\"&lt;&lt;r.width;\n    return o;\n}\nint main(){\n    Rectangle r1(5.0,3.0);\n    cout&lt;&lt;\"Size: \"&lt;&lt;r1&lt;&lt;\"\\n\";\n    cout&lt;&lt;\"Area: \"&lt;&lt;area(r1)&lt;&lt;\"\\n\";\n    return 0;\n}</pre><h4>Conclusion</h4><p>Friend functions are essential for operator overloading and controlled access to private data.</p>"}
 ]
},
{id:3,name:"Operator Overloading",
 topics:"Operator Functions · Binary & Unary Operators · Friend Functions for Operators · Stream Operators · Type Conversion",
 mcqs:[
  {q:"What is the use of the function call operator ()?",opts:["Overloading the method","Overloading the objects","Overloading the parameters","None of the above"],ans:1,exp:"Function call operator () overloads objects, allowing objects to be used like callable functions (functors).",pyq:"2014"},
  {q:"How many arguments for binary operator overloaded as a MEMBER function?",opts:["0","1","2","3"],ans:1,exp:"As MEMBER function: binary operator needs 1 arg ('this' is left operand). As FRIEND function: needs 2 args.",pyq:"2017"},
  {q:"Which operator CANNOT be overloaded in C++?",opts:["+ (plus)","== (equal)",":: (scope resolution)","[] (subscript)"],ans:2,exp:"Cannot overload: :: . .* ?: sizeof. Scope resolution, member access, ternary (?:), and sizeof CANNOT be overloaded.",pyq:"Not verified"},
  {q:"For overloading stream operators (<< and >>), we MUST use:",opts:["Member function","Static function","Friend function","Virtual function"],ans:2,exp:"Stream operators MUST be friend functions because left operand is cin/cout (not a class object). Must return stream reference.",pyq:"2014,2017,2018"},
  {q:"Hiding complexity from users is called:",opts:["Abstraction","Encapsulation","Data hiding","Composition"],ans:0,exp:"ABSTRACTION = hiding complexity. ENCAPSULATION = binding data+methods. DATA HIDING = restricting member access.",pyq:"2018"}
 ],
 short:[
  {q:"What is an operator function? Describe its syntax.",pyq:"2014, 2022",marks:4,ans:"<h4>Definition</h4><p>An <strong>operator function</strong> defines the behavior of an operator for user-defined types. Uses <code>operator</code> keyword.</p><h4>Syntax (Member Function)</h4><pre>return_type operator op(argument){\n    // function body\n}</pre><h4>Example</h4><pre>class Complex{\n    float real,imag;\npublic:\n    Complex operator+(const Complex &c){\n        return Complex(real+c.real,imag+c.imag);\n    }\n};</pre>"},
  {q:"Write syntax for overloading >> and << operators with friend function.",pyq:"★★★ 2014,2017,2018",marks:4,ans:"<h4>Insertion (&lt;&lt;) — for output</h4><pre>friend ostream&amp; operator&lt;&lt;(ostream &out,const Complex &c){\n    out&lt;&lt;c.real&lt;&lt;\"+\"&lt;&lt;c.imag&lt;&lt;\"i\";\n    return out; // Must return stream ref\n}</pre><h4>Extraction (&gt;&gt;) — for input</h4><pre>friend istream&amp; operator&gt;&gt;(istream &in,Complex &c){\n    in&gt;&gt;c.real&gt;&gt;c.imag;\n    return in; // Must return stream ref\n}</pre><p><strong>Note:</strong> MUST be friend functions and MUST return stream reference for chaining.</p>"},
  {q:"What is a copy constructor? When is it called?",pyq:"2017,2019,2021,2024",marks:4,ans:"<h4>Definition</h4><p>A <strong>copy constructor</strong> creates a new object as a copy of an existing object of the same class.</p><h4>Syntax</h4><pre>ClassName(const ClassName &obj){ // note: reference!\n    // copy data members\n}</pre><h4>When Called</h4><ul><li>Object initialized with another: <code>Student s2=s1;</code></li><li>Object passed by value to function</li><li>Object returned by value from function</li></ul><p><strong>IMPORTANT:</strong> Parameter MUST be by reference — else infinite recursion!</p>"}
 ],
 long:[
  {q:"What is operator overloading? Explain type conversion from basic type to class type and class type to basic type.",pyq:"★★★★ 2014,2018,2022",marks:12,ans:"<h4>Introduction</h4><p>Operator overloading gives special meaning to existing operators for user-defined types.</p><h4>Restrictions</h4><ul><li>Cannot create new operators</li><li>Cannot change precedence or associativity</li><li>Cannot overload: <code>:: . .* ?: sizeof</code></li></ul><h4>Basic Type to Class Type (Constructor)</h4><pre>class Distance{\n    int meters;\npublic:\n    Distance(int m){meters=m;} // Conversion constructor\n    void show(){cout&lt;&lt;meters&lt;&lt;\"m\";}\n};\nint main(){\n    Distance d=5; // int auto-converted to Distance\n    d.show();     // 5m\n}</pre><h4>Class Type to Basic Type (Cast Operator)</h4><pre>class Distance{\n    int meters;\npublic:\n    Distance(int m){meters=m;}\n    operator int(){return meters;} // Conversion fn\n};\nint main(){\n    Distance d(10);\n    int x=d;  // Distance auto-converted to int\n    cout&lt;&lt;x;  // 10\n}</pre><h4>Conclusion</h4><p>Operator overloading makes code intuitive. Type conversion enables seamless interaction between built-in and user-defined types.</p>"},
  {q:"Write a C++ program to overload +, - and * operators for a Complex number class.",pyq:"PYQ 2018,2022",marks:12,ans:"<h4>Introduction</h4><p>Overloading arithmetic operators allows complex number arithmetic to look natural, just like built-in types.</p><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass Complex{\n    float real,imag;\npublic:\n    Complex(){real=imag=0;}\n    Complex(float r,float i){real=r;imag=i;}\n    Complex operator+(Complex c){\n        return Complex(real+c.real,imag+c.imag);\n    }\n    Complex operator-(Complex c){\n        return Complex(real-c.real,imag-c.imag);\n    }\n    Complex operator*(Complex c){\n        return Complex(real*c.real-imag*c.imag,\n                      real*c.imag+imag*c.real);\n    }\n    void display(){\n        cout&lt;&lt;real&lt;&lt;\"+\"&lt;&lt;imag&lt;&lt;\"i\\n\";\n    }\n};\nint main(){\n    Complex c1(3.0,4.0),c2(1.5,2.5);\n    cout&lt;&lt;\"Sum: \";\n    (c1+c2).display();\n    cout&lt;&lt;\"Diff: \";\n    (c1-c2).display();\n    cout&lt;&lt;\"Prod: \";\n    (c1*c2).display();\n    return 0;\n}</pre><h4>Conclusion</h4><p>Overloaded operators make complex number arithmetic natural and readable.</p>"}
 ]
},
{id:4,name:"Inheritance",
 topics:"Base & Derived Classes · Protected Members · Constructor/Destructor Order · Public/Private/Protected Inheritance · Abstract Classes · Virtual Functions · Dynamic Binding",
 mcqs:[
  {q:"Base class pointer CANNOT point to derived class. (True/False)",opts:["True","False"],ans:1,exp:"FALSE — Base class pointer CAN point to derived class object. This is the foundation of runtime polymorphism.",pyq:"2014"},
  {q:"Which mechanism allows an object to acquire properties of another object?",opts:["Encapsulation","Abstraction","Inheritance","Polymorphism"],ans:2,exp:"INHERITANCE — derived class acquires data and functions of base class. Key OOP mechanism for code reuse.",pyq:"2018"},
  {q:"What does a derived class NOT inherit from base class?",opts:["Friends","Operator=() members","Constructors & destructors","All of the above"],ans:3,exp:"Derived class does NOT inherit: friends, operator=(), and constructors/destructors from base class.",pyq:"2014"},
  {q:"To defer implementation of functions to derived classes, use:",opts:["An interface","An abstract class","A friend class","A static class"],ans:1,exp:"ABSTRACT CLASS uses pure virtual functions (=0) to force derived classes to implement them.",pyq:"2018"},
  {q:"A virtual function enables:",opts:["Compile-time polymorphism","Runtime polymorphism","Static binding","Data hiding"],ans:1,exp:"Virtual function enables RUNTIME POLYMORPHISM. Correct derived function called via base pointer at runtime.",pyq:"2017,2019"}
 ],
 short:[
  {q:"What is abstract class? What is its benefit?",pyq:"★★★★ 2017,2018,2019,2022,2024",marks:4,ans:"<h4>Definition</h4><p>An <strong>abstract class</strong> contains at least one <strong>pure virtual function</strong> (declared with =0). Objects of abstract class CANNOT be created.</p><h4>Syntax</h4><pre>virtual void draw() = 0; // Pure virtual function</pre><h4>Benefits</h4><ul><li>Provides a common interface for all derived classes</li><li>Forces derived classes to implement specific methods</li><li>Achieves 100% runtime polymorphism</li></ul><pre>class Shape{ // Abstract\npublic:\n    virtual void area()=0;\n};\nclass Circle:public Shape{\npublic:\n    void area(){cout&lt;&lt;\"pi*r*r\";}\n};</pre>"},
  {q:"What is a virtual function? Why is it needed?",pyq:"★★★ 2017,2019,2020,2021,2022",marks:4,ans:"<h4>Definition</h4><p>Declared with <code>virtual</code> keyword. Enables <strong>runtime polymorphism</strong> — correct derived function called via base pointer.</p><h4>Why Needed</h4><p>Without virtual: base pointer always calls base function (static binding). With virtual: correct derived function called at runtime.</p><pre>class Base{\npublic:\n    virtual void show(){cout&lt;&lt;\"Base\";}\n};\nclass Derived:public Base{\npublic:\n    void show(){cout&lt;&lt;\"Derived\";}\n};\nint main(){\n    Base *p=new Derived();\n    p-&gt;show(); // prints \"Derived\"!\n}</pre>"},
  {q:"Explain visibility of base class members with different access specifiers in derived class.",pyq:"2018, 2022",marks:4,ans:"<h4>Inheritance Visibility Table</h4><table style='width:100%;border-collapse:collapse;font-size:.82rem'><tr style='background:rgba(255,215,0,.1)'><th style='padding:.35rem .5rem;border:1px solid rgba(255,255,255,.15)'>Base Member</th><th style='padding:.35rem .5rem;border:1px solid rgba(255,255,255,.15)'>Public Inh.</th><th style='padding:.35rem .5rem;border:1px solid rgba(255,255,255,.15)'>Private Inh.</th><th style='padding:.35rem .5rem;border:1px solid rgba(255,255,255,.15)'>Protected Inh.</th></tr><tr><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1)'>Public</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#4dff88'>Public</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#ff7070'>Private</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#ffd700'>Protected</td></tr><tr style='background:rgba(255,255,255,.03)'><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1)'>Protected</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#ffd700'>Protected</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#ff7070'>Private</td><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:#ffd700'>Protected</td></tr><tr><td style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1)'>Private</td><td colspan='3' style='padding:.3rem .5rem;border:1px solid rgba(255,255,255,.1);color:rgba(255,100,100,.8);text-align:center'>NOT Inherited (inaccessible)</td></tr></table>"}
 ],
 long:[
  {q:"Explain different types of inheritance in C++ with diagrams and programs.",pyq:"★★★★★ 2014,2017,2018,2021,2022,2024",marks:12,ans:"<h4>Introduction</h4><p>Inheritance allows derived class to acquire properties of base class. Syntax: <code>class Derived : access Base { };</code></p><h4>1. Single Inheritance (A → B)</h4><pre>class Animal{public: void eat(){cout&lt;&lt;\"Eat\";}};\nclass Dog:public Animal{void bark(){cout&lt;&lt;\"Bark\";}};</pre><h4>2. Multiple Inheritance (A,B → C)</h4><pre>class C:public A,public B{...};</pre><h4>3. Multilevel Inheritance (A→B→C)</h4><pre>class Animal{};\nclass Dog:public Animal{};\nclass Poodle:public Dog{};</pre><h4>4. Hierarchical Inheritance (A→B,C,D)</h4><pre>class B:public A{};\nclass C:public A{};\nclass D:public A{};</pre><h4>5. Hybrid + Diamond Problem</h4><p>Diamond problem: D inherits B and C, both inherit A → 2 copies of A.</p><p><strong>Solution: Virtual Base Class</strong></p><pre>class B:virtual public A{};\nclass C:virtual public A{};\nclass D:public B,public C{}; // ONE copy of A</pre><h4>Conclusion</h4><p>Inheritance is the most powerful OOP feature. Use virtual base class to solve diamond problem.</p>"},
  {q:"Discuss virtual functions and dynamic binding with complete C++ program.",pyq:"★★★ 2018,2021,2022",marks:12,ans:"<h4>Introduction</h4><p>Virtual functions enable <strong>runtime polymorphism</strong> — calling correct derived function through base pointer.</p><h4>Rules</h4><ul><li>Declared with <code>virtual</code> keyword in base class</li><li>Overridden in derived class (same prototype)</li><li>Called through base class pointer/reference</li><li>Always use virtual destructor when using inheritance!</li></ul><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass Shape{\npublic:\n    virtual void area(){cout&lt;&lt;\"Shape\\n\";}\n    virtual ~Shape(){}\n};\nclass Circle:public Shape{\npublic:\n    void area(){cout&lt;&lt;\"Circle: pi*r*r\\n\";}\n};\nclass Rect:public Shape{\npublic:\n    void area(){cout&lt;&lt;\"Rect: l*b\\n\";}\n};\nint main(){\n    Shape *p;\n    Circle c; Rect r;\n    p=&amp;c; p-&gt;area(); // Circle (dynamic binding)\n    p=&amp;r; p-&gt;area(); // Rect (dynamic binding)\n    return 0;\n}</pre><h4>Conclusion</h4><p>Virtual functions + base pointers = runtime polymorphism. Always use virtual destructor.</p>"}
 ]
},
{id:5,name:"Advanced Topics — Templates, Exception Handling, File Handling",
 topics:"Multiple Inheritance · Virtual Base Classes · Pointers to Members · Function Templates · Class Templates · Exception Handling · File Handling",
 mcqs:[
  {q:"The generic type in a template function:",opts:["Must be T","Can be T","Cannot be T for your functions","Cannot be T"],ans:1,exp:"Generic type CAN be named anything (T, U, TYPE, etc.) — T is just a popular convention.",pyq:"2018"},
  {q:"Which is used to implement C++ interfaces?",opts:["Absolute variables","Abstract classes","Constant variables","None of the above"],ans:1,exp:"C++ has no 'interface' keyword. Interfaces are implemented using abstract classes with all pure virtual functions.",pyq:"2019"},
  {q:"What are the three keywords for Exception Handling?",opts:["try and error","try, catch and throw","catch and handle","error and handler"],ans:1,exp:"try: code that may throw. throw: signals exception. catch: handles exception. These 3 form C++ exception handling.",pyq:"2017"},
  {q:"Namespace is used to:",opts:["Group classes, objects and functions","Mark start of program","Separate classes and objects","None of above"],ans:0,exp:"Namespace groups related identifiers to avoid naming conflicts. 'using namespace std;' is the most common use.",pyq:"2019"},
  {q:"Scope resolution operator (::) is used to:",opts:["Create objects","Define members externally","Declare classes","None of above"],ans:1,exp:":: defines class members outside class. Syntax: void ClassName::funcName(){ } — required for external definition.",pyq:"2019"}

  {q:"What are templates? Explain function template and class template with complete examples.",pyq:"★★★★ 2014,2017,2018,2019",marks:12,ans:"<h4>Introduction</h4><p>Templates enable GENERIC PROGRAMMING — write once, use with any data type.</p><h4>Function Template</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\ntemplate &lt;typename T&gt;\nT findMin(T a,T b){\n    return (a&lt;b)?a:b;\n}\nint main(){\n    cout&lt;&lt;findMin(3,7)&lt;&lt;endl;        // 3\n    cout&lt;&lt;findMin(3.14,2.71)&lt;&lt;endl;  // 2.71\n    cout&lt;&lt;findMin('z','a')&lt;&lt;endl;    // a\n}</pre><h4>Class Template</h4><pre>template &lt;class T&gt;\nclass Stack{\n    T data[100]; int top;\npublic:\n    Stack(){top=-1;}\n    void push(T val){data[++top]=val;}\n    T pop(){return data[top--];}\n    bool isEmpty(){return top==-1;}\n};\nint main(){\n    Stack&lt;int&gt; s;\n    s.push(10); s.push(20);\n    cout&lt;&lt;s.pop(); // 20\n}</pre><h4>Advantages</h4><ul><li>Write once, use with any type</li><li>Type-safe at compile time</li><li>STL (Standard Template Library) is built using templates</li></ul><h4>Conclusion</h4><p>Templates are C++'s most powerful feature. They form the foundation of generic programming and the entire STL.</p>"},
  {q:"Define exception handling. Write a C++ program using try, catch, throw with constructor and destructor.",pyq:"★★★ 2014,2017,2018,2022",marks:12,ans:"<h4>Introduction</h4><p>Exception handling separates error code from normal code, making programs more robust.</p><h4>Flow</h4><ul><li>Code in try block executes normally</li><li>On error, throw is executed</li><li>Control jumps to matching catch block</li><li>Destructors called during stack unwinding</li></ul><h4>Program</h4><pre>#include&lt;iostream&gt;\nusing namespace std;\nclass BankAccount{\n    float balance;\npublic:\n    BankAccount(float b){\n        if(b&lt;0) throw \"Negative balance!\";\n        balance=b;\n        cout&lt;&lt;\"Account opened: \"&lt;&lt;b&lt;&lt;\"\\n\";\n    }\n    void withdraw(float amt){\n        if(amt&gt;balance) throw amt;\n        balance-=amt;\n        cout&lt;&lt;\"Withdrawn: \"&lt;&lt;amt&lt;&lt;\"\\n\";\n    }\n    ~BankAccount(){\n        cout&lt;&lt;\"Account closed. Balance:\"&lt;&lt;balance&lt;&lt;\"\\n\";\n    }\n};\nint main(){\n    try{\n        BankAccount acc(1000);\n        acc.withdraw(500);\n        acc.withdraw(800); // Throws!\n    }\n    catch(const char* msg){\n        cout&lt;&lt;\"Error: \"&lt;&lt;msg&lt;&lt;\"\\n\";\n    }\n    catch(float amt){\n        cout&lt;&lt;\"Insufficient! Need:\"&lt;&lt;amt&lt;&lt;\"\\n\";\n    }\n    return 0;\n}</pre><h4>Conclusion</h4><p>Exception handling with constructors/destructors ensures proper cleanup. Use multiple catch blocks for different error types.</p>"}

// ═══════════════════════════════════════════
//  KBC GAME STATE
// ═══════════════════════════════════════════
const KBC = {};

function kbcInit(uid){
  KBC[uid]={cur:0,score:0,ans:Array(DATA[uid-1].mcqs.length).fill(null),used50:false,usedFlip:false,timer:null,t:30};
  kbcRender(uid);
}

function kbcRender(uid){
  const u=DATA[uid-1];
  const st=KBC[uid];
  const q=u.mcqs[st.cur];
  const n=u.mcqs.length;
  const isLast=st.cur===n-1;
  const answered=st.ans[st.cur];
  const prizes=['Rs.500','Rs.1,000','Rs.2,000','Rs.5,000','Rs.10,000'];

  // Update status
  const qnumEl=document.getElementById('kqnum'+uid);
  if(qnumEl) qnumEl.textContent='Q '+(st.cur+1)+' / '+n;
  const scoreEl=document.getElementById('kscore'+uid);
  if(scoreEl) scoreEl.textContent='Score: '+st.score;
  const prizeEl=document.getElementById('kprize'+uid);
  if(prizeEl) prizeEl.textContent='🏆 '+prizes[Math.min(st.cur,prizes.length-1)];

  // Dots
  for(let i=0;i<n;i++){
    const d=document.getElementById('kdot'+uid+'_'+i);
    if(!d) continue;
    d.className='dot';
    if(i===st.cur) d.classList.add('dcur');
    else if(st.ans[i]!==null){
      const a=st.ans[i];
      d.classList.add((a===-2||(a>=0&&a===u.mcqs[i].ans))?'dok':'dbad');
    }
  }

  // Question
  const qbox=document.getElementById('kqbox'+uid);
  if(qbox){
    const pyqHtml=q.pyq?'<span class="pyqb">★ '+q.pyq+'</span>':'';
    qbox.innerHTML='<div class="kqtext">'+q.q+pyqHtml+'</div>';
    qbox.style.display='';
  }

  // Options
  const grid=document.getElementById('kgrid'+uid);
  if(grid){
    grid.style.display='';
    grid.innerHTML='';
    const labels=['A','B','C','D'];
    q.opts.forEach(function(opt,i){
      var cls='kopt';
      if(answered!==null&&answered!==-2){
        if(i===q.ans) cls+=' rok';
        else if(i===answered&&answered!==q.ans) cls+=' rbad';
      }
      var btn=document.createElement('div');
      btn.className=cls;
      btn.setAttribute('data-uid',uid);
      btn.setAttribute('data-idx',i);
      btn.innerHTML='<div class="ocircle">'+labels[i]+'</div><span class="otext">'+opt+'</span>';
      grid.appendChild(btn);
    });
    // Re-apply 50:50 disable
    if(st.used50&&answered===null){
      var opts=grid.querySelectorAll('.kopt');
      var rm=0;
      for(var i=0;i<opts.length&&rm<2;i++){
        if(i!==q.ans){opts[i].classList.add('dis');rm++;}
      }
    }
  }

  // Explanation
  const expEl=document.getElementById('kexp'+uid);
  if(expEl){
    if(answered!==null&&answered!==-2){
      expEl.innerHTML='<strong>'+(answered===q.ans?'✅ Correct!':'❌ Wrong!')+'</strong> '+q.exp;
      expEl.className='kexp show';
    } else if(answered===-2){
      expEl.innerHTML='<strong>↩️ Flipped!</strong> Correct answer: <strong>'+['A','B','C','D'][q.ans]+'</strong> — '+q.opts[q.ans];
      expEl.className='kexp show';
    } else {
      expEl.innerHTML='';
      expEl.className='kexp';
    }
  }

  // Next button
  const nextBtn=document.getElementById('knext'+uid);
  if(nextBtn){
    if(answered!==null){
      nextBtn.className='kbtn knext show';
      nextBtn.textContent=isLast?'🏆 Finish':'Next →';
    } else {
      nextBtn.className='kbtn knext';
    }
  }

  // Finish
  const fin=document.getElementById('kfin'+uid);
  if(fin) fin.className='kfinish';

  // Timer
  if(answered===null) kbcStartTimer(uid);
}

function kbcStartTimer(uid){
  const st=KBC[uid];
  clearInterval(st.timer);
  st.t=30;
  kbcUpdateTimer(uid);
  st.timer=setInterval(function(){
    st.t--;
    kbcUpdateTimer(uid);
    if(st.t<=0){
      clearInterval(st.timer);
      if(KBC[uid].ans[KBC[uid].cur]===null){
        KBC[uid].ans[KBC[uid].cur]=-1;
        kbcRender(uid);
      }
    }
  },1000);
}

function kbcUpdateTimer(uid){
  const el=document.getElementById('ktimer'+uid);
  if(!el) return;
  const s=Math.max(0,KBC[uid].t);
  el.textContent='00:'+String(s).padStart(2,'0');
  el.className='ktimer';
  if(s<=5) el.classList.add('danger');
  else if(s<=10) el.classList.add('warn');
}

function kbcClick(uid,idx){
  const st=KBC[uid];
  if(st.ans[st.cur]!==null) return;
  clearInterval(st.timer);
  // Lock-in effect
  const opts=document.querySelectorAll('#kgrid'+uid+' .kopt');
  if(opts[idx]) opts[idx].classList.add('locked');
  st.ans[st.cur]=idx;
  if(idx===DATA[uid-1].mcqs[st.cur].ans) st.score++;
  setTimeout(function(){ kbcRender(uid); },1200);
}

function kbcNext(uid){
  const st=KBC[uid];
  clearInterval(st.timer);
  const n=DATA[uid-1].mcqs.length;
  if(st.cur<n-1){ st.cur++; kbcRender(uid); }
  else { kbcFinish(uid); }
}

function kbcPrev(uid){
  const st=KBC[uid];
  clearInterval(st.timer);
  if(st.cur>0){ st.cur--; kbcRender(uid); }
}

function kbcFinish(uid){
  const u=DATA[uid-1];
  const st=KBC[uid];
  clearInterval(st.timer);
  const n=u.mcqs.length;
  const pct=Math.round((st.score/n)*100);
  const grade=pct>=80?'🏆':pct>=60?'🥈':pct>=40?'📚':'💪';
  const msg=pct>=80?'Excellent! Expert level!':pct>=60?'Good Job!':pct>=40?'Keep Practising!':'Need more revision!';
  const dotHtml=st.ans.map(function(a,i){
    var c=a===-2||a===u.mcqs[i].ans?'dok':'dbad';
    return '<div class="dot '+c+'"></div>';
  }).join('');

  // Hide game elements
  var els=['kqbox','kgrid','kexp'];
  els.forEach(function(id){
    var el=document.getElementById(id+uid);
    if(el) el.style.display='none';
  });
  var statusEl=document.getElementById('kstatus'+uid);
  if(statusEl) statusEl.style.display='none';
  var prizeEl=document.getElementById('kprize'+uid);
  if(prizeEl) prizeEl.style.display='none';
  var nav=document.getElementById('knav'+uid);
  if(nav) nav.style.display='none';

  var fin=document.getElementById('kfin'+uid);
  if(fin){
    fin.innerHTML='<div class="grade">'+grade+'</div><h3>'+st.score+' / '+n+'</h3><p class="smsg">Score: '+pct+'% — '+msg+'</p><div class="kdots" style="justify-content:center;margin:.75rem 0">'+dotHtml+'</div><button class="playagain" onclick="kbcRestart('+uid+')">🔄 Play Again</button>';
    fin.className='kfinish show';
  }
}

function kbcRestart(uid){
  const n=DATA[uid-1].mcqs.length;
  clearInterval(KBC[uid].timer);
  KBC[uid]={cur:0,score:0,ans:Array(n).fill(null),used50:false,usedFlip:false,timer:null,t:30};

  // Show all elements again
  var els=['kqbox','kgrid','kexp'];
  els.forEach(function(id){
    var el=document.getElementById(id+uid);
    if(el) el.style.display='';
  });
  var statusEl=document.getElementById('kstatus'+uid);
  if(statusEl) statusEl.style.display='';
  var prizeEl=document.getElementById('kprize'+uid);
  if(prizeEl) prizeEl.style.display='';
  var nav=document.getElementById('knav'+uid);
  if(nav) nav.style.display='';

  // Re-enable lifelines
  var ll50=document.getElementById('kll50_'+uid);
  if(ll50) ll50.className='kbc-lf';
  var llflip=document.getElementById('kllflip_'+uid);
  if(llflip) llflip.className='kbc-lf';

  kbcRender(uid);
}

function use50(uid){
  const st=KBC[uid];
  if(st.ans[st.cur]!==null||st.used50) return;
  st.used50=true;
  var ll=document.getElementById('kll50_'+uid);
  if(ll) ll.className='kbc-lf lf-used';
  var q=DATA[uid-1].mcqs[st.cur];
  var opts=document.querySelectorAll('#kgrid'+uid+' .kopt');
  var rm=0;
  for(var i=0;i<opts.length&&rm<2;i++){
    if(i!==q.ans){opts[i].classList.add('dis');rm++;}
  }
}

function useFlip(uid){
  const st=KBC[uid];
  if(st.ans[st.cur]!==null||st.usedFlip) return;
  st.usedFlip=true;
  clearInterval(st.timer);
  var ll=document.getElementById('kllflip_'+uid);
  if(ll) ll.className='kbc-lf lf-used';
  st.ans[st.cur]=-2;
  kbcRender(uid);
}

function buildKBC(u){
  var n=u.mcqs.length;
  var dots='';
  for(var i=0;i<n;i++) dots+='<div class="dot" id="kdot'+u.id+'_'+i+'"></div>';
  return '<div class="kbc-arena" id="kbc'+u.id+'">'
    +'<div class="kbc-bg"></div>'
    +'<div class="kbc-rays"></div>'
    +'<div class="kbc-in">'
    +'<div class="kbc-logo-row"><div class="kbc-logo">KBC</div></div>'
    +'<div class="kbc-lf-row">'
    +'<button class="kbc-lf" id="kll50_'+u.id+'" onclick="use50('+u.id+')" title="50:50 — Remove 2 wrong options">50:50</button>'
    +'<div class="kbc-lf lf-used" title="Phone a Friend">📞</div>'
    +'<div class="kbc-lf lf-used" title="Ask Audience">👥</div>'
    +'<button class="kbc-lf" id="kllflip_'+u.id+'" onclick="useFlip('+u.id+')" title="Flip — Skip question">↩️</button>'
    +'<div class="kbc-lf lf-used" title="Double Dip">2×</div>'
    +'</div>'
    +'<div class="kprize" id="kprize'+u.id+'">🏆 Rs.500</div>'
    +'<div class="kbc-status" id="kstatus'+u.id+'">'
    +'<span class="kbc-qnum" id="kqnum'+u.id+'">Q 1 / '+n+'</span>'
    +'<div class="kdots">'+dots+'</div>'
    +'<span class="kscore" id="kscore'+u.id+'">Score: 0</span>'
    +'<span class="ktimer" id="ktimer'+u.id+'">00:30</span>'
    +'</div>'
    +'<div class="kbc-qbox" id="kqbox'+u.id+'"><div class="kqtext">Loading...</div></div>'
    +'<div class="kbc-grid" id="kgrid'+u.id+'"></div>'
    +'<div class="kexp" id="kexp'+u.id+'"></div>'
    +'<div class="kfinish" id="kfin'+u.id+'"></div>'

    +'<button class="kbtn knext" id="knext'+u.id+'" onclick="kbcNext('+u.id+')">Next →</button>'
    +'</div>'

function buildAccordion(items,prefix,uid){
  var html='';
  items.forEach(function(item,i){
    var mcls=item.marks===4?'m4':'m12';
    var mlbl=item.marks===4?'4 Marks':'12 Marks';
    var id=prefix+'_'+uid+'_'+i;
    html+='<div class="acc" id="acc_'+id+'">'
      +'<div class="acchd" onclick="toggleAcc(\'acc_'+id+'\')">'
      +'<span class="am '+mcls+'">'+mlbl+'</span>'
      +'<span class="accq">'+item.q+'</span>'
      +'<span class="apyq">'+item.pyq+'</span>'
      +'<span class="achv">▼</span>'
      +'</div>'
      +'<div class="accbody">'+item.ans+'</div>'
      +'</div>';
  });
  return html;
}

  DATA.forEach(function(u){ kbcInit(u.id); });

  document.querySelectorAll('.tbtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var paneId=btn.getAttribute('data-pane');
      var usec=btn.closest('.usec');
      usec.querySelectorAll('.tbtn').forEach(function(b){ b.classList.remove('act'); });
      usec.querySelectorAll('.tpane').forEach(function(p){ p.classList.remove('act'); });
      btn.classList.add('act');
      var pane=document.getElementById(paneId);
      if(pane) pane.classList.add('act');
    });
  });

  // Option click handler (event delegation)
  document.getElementById('maindiv').addEventListener('click',function(e){
    var opt=e.target.closest('.kopt');
    if(!opt) return;
    var uid=parseInt(opt.getAttribute('data-uid'));
    var idx=parseInt(opt.getAttribute('data-idx'));
    if(!isNaN(uid)&&!isNaN(idx)) kbcClick(uid,idx);
  });
}

// ═══════════════════════════════════════════
//  NAV & SCROLL
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',function(){
  renderPage();

  // Nav buttons
  document.querySelectorAll('.nb').forEach(function(btn){
    btn.addEventListener('click',function(){
      var target=btn.getAttribute('data-target');
      var el=document.getElementById(target);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.nb').forEach(function(b){ b.classList.remove('act'); });
      btn.classList.add('act');
    });
  });

  // Scroll top button
  document.getElementById('stbtn').addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });

  // Progress bar + scroll-top visibility
  window.addEventListener('scroll',function(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    var pct=h>0?(window.scrollY/h)*100:0;
    document.getElementById('pb').style.width=pct+'%';
    var stbtn=document.getElementById('stbtn');
    if(window.scrollY>400) stbtn.classList.add('show');
    else stbtn.classList.remove('show');
  });
});

// Global toggleAcc for accordion
function toggleAcc(id){
  var el=document.getElementById(id);
  if(el) el.classList.toggle('open');
}
</script>
