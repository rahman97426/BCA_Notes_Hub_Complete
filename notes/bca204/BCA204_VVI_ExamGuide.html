CALL BY REFERENCE (original changes):
void swap(int *a, int *b) {
   int t = *a; *a = *b; *b = t;
}

}

ADVANTAGES:

2. Code clean aur small hota hai
3. Tree, graph problems ke liye best

DISADVANTAGES:
1. Stack overflow ka risk (too many calls)
2. Memory zyada use hoti hai
3. Debug karna mushkil

FACTORIAL PROGRAM:
#include <stdio.h>
int fact(int n) {
   if(n==0 || n==1) return 1;  // BASE CASE
   return n * fact(n-1);        // Recursive call
}
int main() {
   int n; scanf("%d", &n);
   printf("Factorial = %d", fact(n));
}

RECURSION TREE (fact(4)):
fact(4) → 4 * fact(3)
           → 3 * fact(2)
              → 2 * fact(1) → 1 ← BASE CASE
= 4*3*2*1 = 24

CONCLUSION: Base case bhoolna = infinite recursion = stack overflow!` },

        ans:`RANDOM ACCESS — Move to Any Position!

fseek() — File pointer ko move karo:
Syntax: int fseek(FILE *fp, long offset, int origin);

ORIGINS (starting point):
SEEK_SET = file beginning se (byte 0)
SEEK_CUR = current position se
SEEK_END = file end se

EXAMPLES:
fseek(fp, 0, SEEK_SET);    // Go to beginning
fseek(fp, 10, SEEK_SET);   // Go to byte 10
fseek(fp, 5, SEEK_CUR);    // Move 5 bytes ahead
fseek(fp, -5, SEEK_END);   // 5 bytes before end

ftell() — Current position kya hai?
Syntax: long ftell(FILE *fp);
long pos = ftell(fp);  // returns byte position

FIND FILE SIZE:
fseek(fp, 0, SEEK_END);
long size = ftell(fp);   // file size in bytes

rewind() — Back to very beginning:
Syntax: void rewind(FILE *fp);
rewind(fp);  // same as fseek(fp, 0, SEEK_SET)

SEQUENTIAL vs RANDOM:
Feature    | Sequential        | Random Access
-----------|-------------------|-----------------
Access     | Start to end only | Any position
Functions  | fgets, fprintf    | fseek, ftell
Speed      | Slow for specific | Fast for specific
Use case   | Log files, CSV    | Database records` },

-------------|---------------------|--------------------
Data stored  | Characters (ASCII)  | Binary (0s and 1s)
Readable     | Human readable ✓    | NOT human readable
End of line  | \\n (newline)        | No special char
Size         | Larger              | Smaller
Speed        | Slower              | FASTER
Open mode    | r, w, a             | rb, wb, ab
Functions    | fprintf, fgets      | fread, fwrite
Examples     | .txt, .csv, .c      | .dat, .bin, .exe

TEXT FILE:
FILE *fp = fopen("data.txt", "w");

BINARY FILE:
FILE *fp = fopen("data.bin", "wb");

fwrite(&n, sizeof(int), 1, fp);  // Stores as 4 bytes

CONCLUSION:

                  <div key={i} style={card}>
                    <div style={{padding:"10px 14px",background:"#243447",borderBottom:"1px solid #334155"}}>
                      <div style={{color:"#F59E0B",fontWeight:"700",fontSize:"13px"}}>{p.name}</div>
                      <div style={{color:"#10B981",fontSize:"11px"}}>PYQ: {p.pyq}</div>
                    </div>
                    <pre style={{fontFamily:"'Courier New',monospace",fontSize:"11px",color:"#7DD3FC",padding:"12px 14px",margin:0,overflowX:"auto",whiteSpace:"pre-wrap",lineHeight:"1.6"}}>{p.code}</pre>
                  </div>
                ))}
              </div>
            )}

            {/* REVISION */}
            {tab === "rev" && (
              <div>
                <div style={{color:"#F59E0B",fontWeight:"700",marginBottom:"10px",fontSize:"13px"}}>
                  ⚡ 5-MINUTE REVISION — Exam se pehle padh lo!
                </div>
                <div style={card}>
                  <div style={{padding:"14px"}}>
                    {cu.revision.map((r, i) => (
                      <div key={i} style={{padding:"7px 0",borderBottom:i<cu.revision.length-1?"1px solid #334155":"none",
                        fontSize:"12px",color:"#E2E8F0",display:"flex",alignItems:"flex-start",gap:"8px"}}>
                        <span style={{color:C,fontWeight:"900",fontSize:"14px",flexShrink:0}}>✓</span>
                        <span style={{lineHeight:"1.5"}}>{r}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        {/* SUMMARY SECTION */}
        {unit === 8 && (
          <div>
            <div style={{background:"#16332244",border:"1px solid #84CC1644",borderRadius:"10px",padding:"10px 14px",marginBottom:"14px"}}>
              <div style={{color:"#84CC16",fontWeight:"900",fontSize:"15px"}}>📋 Complete Summary & Revision</div>
              <div style={{color:"#94A3B8",fontSize:"11px"}}>Top 30 VVI · Programs · Crash Sheet · Checklist</div>
            </div>

            <div style={{display:"flex",background:"#1E293B",borderRadius:"8px",marginBottom:"14px",overflow:"hidden"}}>
              {sTabs.map(t => (
                <button key={t.id} onClick={() => setSumTab(t.id)}
                  style={{flex:1,padding:"10px 2px",border:"none",cursor:"pointer",fontSize:"10px",
                    background:sumTab===t.id?"#163322":"transparent",color:sumTab===t.id?"#84CC16":"#94A3B8",
                    fontWeight:sumTab===t.id?"700":"400",borderBottom:sumTab===t.id?"2px solid #84CC16":"2px solid transparent"}}>
                  {t.label}
                </button>
              ))}
            </div>

            {/* TOP 30 */}
            {sumTab === "top30" && (
              <div>
                <div style={{color:"#F59E0B",fontWeight:"700",marginBottom:"10px",fontSize:"13px"}}>
                  🏆 TOP 30 VVI QUESTIONS — Unit + Marks + PYQ Year
                </div>
                {top30.map(q => (
                  <div key={q.n} style={{...card,marginBottom:"8px"}}>
                    <div style={{padding:"10px 14px"}}>
                      <div style={{display:"flex",flexWrap:"wrap",gap:"4px",marginBottom:"4px",alignItems:"center"}}>
                        <span style={{color:"#F59E0B",fontSize:"12px",fontWeight:"700"}}>#{q.n}</span>
                        <Bdg txt={`U${q.u}`} col={UCOLORS[q.u]} />
                        <Bdg txt={`${q.m}M`} col="#94A3B8" />
                        <span style={{color:"#F59E0B",fontSize:"11px"}}>{"🔥".repeat(q.f)}</span>
                      </div>
                      <div style={{fontSize:"12px",color:"#E2E8F0",lineHeight:"1.4",marginBottom:"4px"}}>{q.q}</div>
                      <div style={{fontSize:"10px",color:"#10B981"}}>PYQ: {q.p}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TOP 10 PROGRAMS */}
            {sumTab === "prog10" && (
              <div>
                <div style={{color:"#F59E0B",fontWeight:"700",marginBottom:"10px",fontSize:"13px"}}>
                  💻 TOP 10 PROGRAMS — Sab likhna aana chahiye!
                </div>
                {top10Programs.map(p => (
                  <div key={p.n} style={{...card,padding:"12px 14px",marginBottom:"8px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div style={{flex:1}}>
                        <div style={{color:"#F59E0B",fontWeight:"700",fontSize:"13px"}}>#{p.n} {p.name}</div>
                        <div style={{fontSize:"11px",color:"#10B981",marginTop:"3px"}}>PYQ: {p.pyq}</div>
                      </div>
                      <Bdg txt={p.u} col="#8B5CF6" />
                    </div>
                  </div>
                ))}
                <div style={{...card,padding:"14px",background:"#1a1a2e",border:"1px solid #F59E0B44",marginTop:"12px"}}>
                  <div style={{color:"#F59E0B",fontWeight:"700",fontSize:"13px",marginBottom:"8px"}}>
                    🎯 EXAM DAY STRATEGY — 60 Marks Plan
                  </div>
                  {["Q1: MCQs — Any 6 (2×6=12 marks)","Q2: Short Answers — Any 3 (4×3=12 marks)","Q3–Q7: Long Answers — Any 3 (12×3=36 marks)","Total = 12+12+36 = 60 marks","Q1 aur Q2 COMPULSORY hain!","Time: 3 hours — 4 mins per mark","Definitions + Syntax + Example + Conclusion"].map((s,i) => (
                    <div key={i} style={{fontSize:"12px",color:"#E2E8F0",padding:"4px 0",borderBottom:i<6?"1px solid #334155":"none",display:"flex",gap:"8px",alignItems:"flex-start"}}>
                      <span style={{color:"#F59E0B",flexShrink:0}}>→</span>{s}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CRASH SHEET */}
            {sumTab === "crash" && (
              <div>
                <div style={{color:"#F59E0B",fontWeight:"700",marginBottom:"10px",fontSize:"13px"}}>
                  ⚡ ONE-DAY CRASH SHEET — Exam se ek din pehle yahi padho!
                </div>
                {crashPoints.map((cp, idx) => (
                  <div key={idx} style={{...card,marginBottom:"10px",border:`1px solid ${cp.color}33`}}>
                    <div style={{padding:"10px 14px",background:`${cp.color}18`,borderBottom:`1px solid ${cp.color}33`}}>
                      <div style={{color:cp.color,fontWeight:"700",fontSize:"13px"}}>📌 {cp.unit}</div>
                    </div>
                    <div style={{padding:"10px 14px"}}>
                      {cp.pts.map((pt, i) => (
                        <div key={i} style={{fontSize:"12px",color:"#E2E8F0",padding:"4px 0",
                          borderBottom:i<cp.pts.length-1?"1px solid #334155":"none",
                          display:"flex",alignItems:"flex-start",gap:"8px"}}>
                          <span style={{color:cp.color,flexShrink:0}}>→</span><span>{pt}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
                <div style={{...card,padding:"16px",background:"#1a1a2e",border:"1px solid #F59E0B",marginTop:"4px"}}>
                  <div style={{color:"#F59E0B",fontWeight:"900",fontSize:"14px",marginBottom:"10px",textAlign:"center"}}>
                    🏆 SUCCESS FORMULA — Exam mein top karo!
                  </div>
                  {["📝 Definition likho → explains what it is","📋 Numbered points → easy to read","💻 Syntax + Code → shows understanding","📊 Table/Comparison → if applicable","✅ Conclusion → 1-2 lines summary","⭐ Pointers + File Handling = most marks!","⚡ MCQs mein switch/float = almost always asked"].map((s,i) => (
                    <div key={i} style={{fontSize:"12px",color:"#E2E8F0",padding:"4px 0",lineHeight:"1.5"}}>{s}</div>
                  ))}
                </div>
              </div>
            )}

            {/* CHECKLIST */}
            {sumTab === "check" && (
              <div>
                <div style={{color:"#F59E0B",fontWeight:"700",marginBottom:"10px",fontSize:"13px"}}>
                  ✅ FULL SYLLABUS CHECKLIST — Tap to tick completed topics!
                </div>
                {syllabus.map((s, sidx) => {
                  const uc = UCOLORS[sidx+1];
                  const done = s.topics.filter((_,i) => checks[`${s.unit}-${i}`]).length;
                  return (
                    <div key={s.unit} style={{...card,marginBottom:"10px"}}>
                      <div style={{padding:"10px 14px",background:`${uc}18`,borderBottom:`1px solid ${uc}33`}}>
                        <div style={{color:uc,fontWeight:"700",fontSize:"13px"}}>{s.unit}</div>
                        <div style={{color:"#94A3B8",fontSize:"11px",marginTop:"2px"}}>
                          {done}/{s.topics.length} completed
                          {done === s.topics.length && " 🎉 Done!"}
                        </div>
                      </div>
                      <div style={{padding:"10px 14px"}}>
                        {s.topics.map((t, ti) => {
                          const key = `${s.unit}-${ti}`;
                          const checked = checks[key];
                          return (
                            <div key={ti} onClick={() => toggleCheck(key)}
                              style={{display:"flex",alignItems:"center",gap:"8px",padding:"5px 0",
                                borderBottom:ti<s.topics.length-1?"1px solid #334155":"none",cursor:"pointer"}}>
                              <div style={{width:"16px",height:"16px",borderRadius:"3px",flexShrink:0,
                                border:`2px solid ${checked?uc:"#475569"}`,background:checked?uc:"transparent",
                                display:"flex",alignItems:"center",justifyContent:"center"}}>
                                {checked && <span style={{color:"white",fontSize:"10px",fontWeight:"900"}}>✓</span>}
                              </div>
                              <span style={{fontSize:"12px",color:checked?"#6B7280":"#E2E8F0",
                                textDecoration:checked?"line-through":"none"}}>{t}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{textAlign:"center",padding:"16px",color:"#475569",fontSize:"11px",borderTop:"1px solid #1E293B"}}>
        📘 BCA-204 AKU Patna 2026 · Concept Clear → Practice More → Score High 🏆
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BCA204Guide />);
</script>
</body>
</html>
