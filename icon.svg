  <rect x="292" y="176" width="58" height="9" rx="4" fill="rgba(255,255,255,0.52)"/>
  <rect x="292" y="204" width="76" height="9" rx="4" fill="rgba(255,255,255,0.78)"/>
  <rect x="292" y="232" width="50" height="9" rx="4" fill="rgba(255,255,255,0.52)"/>
  <rect x="292" y="260" width="70" height="9" rx="4" fill="rgba(255,255,255,0.78)"/>
  <!-- BCA text -->
