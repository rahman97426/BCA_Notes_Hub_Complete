<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>BCA Notes Hub | Sem I–VI | Abdul Rahman</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      /* =========================================================
   ROOT
========================================================= */
      :root {
        --bg: #000;
        --surface: rgba(255, 255, 255, 0.04);
        --surface2: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.14);
        --txt: #fff;
        --muted: #94a3b8;
        --glass: blur(24px);
        --r: 18px;
        --shadow: 0 12px 48px -8px rgba(0, 0, 0, 0.8);
      }

      body.light {
        --bg: #eef2f9;
        --surface: rgba(255, 255, 255, 0.75);
        --surface2: rgba(255, 255, 255, 0.9);
        --border: rgba(0, 0, 0, 0.07);
        --border2: rgba(0, 0, 0, 0.12);
        --txt: #0f172a;
        --muted: #475569;
        --shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: var(--txt);
        min-height: 100vh;
        overflow-x: hidden;
        transition:
          background 0.3s,
          color 0.3s;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      /* =========================================================
   SPACE BACKGROUND
========================================================= */
      .space {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(ellipse at 20% 0%, #1a0a3e 0%, #000 50%);
        overflow: hidden;
      }

      body.light .space {
        background: linear-gradient(135deg, #dde6f7 0%, #eef2f9 100%);
      }

      body.light .stars {
        opacity: 0.04;
      }

      body.light .nebula {
        opacity: 0.08;
      }

      .stars {
        position: absolute;
        inset: 0;
        opacity: 0.7;
        background-image:
          radial-gradient(1px 1px at 10% 8%, #fff, transparent),
          radial-gradient(1px 1px at 20% 60%, #fff, transparent),
          radial-gradient(1px 1px at 30% 25%, #aaa, transparent),
          radial-gradient(1px 1px at 42% 80%, #fff, transparent),
          radial-gradient(1px 1px at 55% 15%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 65% 55%, #fff, transparent),
          radial-gradient(1px 1px at 75% 90%, #aaa, transparent),
          radial-gradient(1px 1px at 85% 35%, #fff, transparent),
          radial-gradient(1px 1px at 92% 70%, #fff, transparent),
          radial-gradient(1px 1px at 5% 95%, #fff, transparent),
          radial-gradient(1px 1px at 37% 45%, #aaa, transparent),
          radial-gradient(1px 1px at 50% 50%, #fff, transparent),
          radial-gradient(1px 1px at 78% 12%, #aaa, transparent),
          radial-gradient(1px 1px at 14% 40%, #fff, transparent),
          radial-gradient(1px 1px at 60% 30%, #fff, transparent),
          radial-gradient(1px 1px at 90% 85%, #fff, transparent),
          radial-gradient(1px 1px at 25% 70%, #aaa, transparent),
          radial-gradient(1px 1px at 48% 20%, #fff, transparent),
          radial-gradient(1px 1px at 70% 65%, #fff, transparent),
          radial-gradient(1px 1px at 33% 88%, #aaa, transparent);
        animation: twinkle 8s ease-in-out infinite alternate;
      }

      .nebula {
        position: absolute;
        width: 600px;
        height: 600px;
        top: -100px;
        right: -100px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.18) 0%,
          transparent 70%
        );
        filter: blur(60px);
        animation: nebulaPulse 12s ease-in-out infinite alternate;
      }

      .nebula2 {
        position: absolute;
        width: 400px;
        height: 400px;
        bottom: -50px;
        left: -80px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.12) 0%,
          transparent 70%
        );
        filter: blur(50px);
        animation: nebulaPulse 15s ease-in-out infinite alternate-reverse;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.5;
        }

        100% {
          opacity: 0.9;
        }
      }

      @keyframes nebulaPulse {
        0% {
          transform: scale(1);
        }

        100% {
          transform: scale(1.2);
        }
      }

      /* =========================================================
   HEADER
========================================================= */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.6);
        border-bottom: 1px solid var(--border);
        backdrop-filter: var(--glass);
        -webkit-backdrop-filter: var(--glass);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 64px;
      }

      body.light .header {
        background: rgba(255, 255, 255, 0.75);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Outfit";
        font-size: 1.15rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
      }

      .logo-sub {
        font-size: 0.65rem;
        color: var(--muted);
        font-weight: 600;
        display: block;
        line-height: 1;
      }

      .header-mid {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      /* Search bar in header */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px 16px;
        width: 100%;
        max-width: 380px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .search-bar:hover {
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .search-bar i {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .search-bar span {
        color: var(--muted);
        font-size: 0.85rem;
        flex: 1;
        text-align: left;
      }

      .search-bar kbd {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border2);
        border-radius: 5px;
        padding: 2px 7px;
        font-size: 0.7rem;
        font-family: monospace;
        color: var(--muted);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Stats pill */
      .stats-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #10b981;
        white-space: nowrap;
      }

      .stats-pill i {
        font-size: 0.7rem;
      }

      /* Icon buttons */
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .icon-btn:hover {
        background: var(--surface2);
        color: var(--txt);
        border-color: var(--border2);
      }

      /* =========================================================
   SEMESTER TABS
========================================================= */
      .sem-tabs-wrap {
        position: sticky;
        top: 64px;
        z-index: 99;
        background: rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid var(--border);
        backdrop-filter: var(--glass);
        -webkit-backdrop-filter: var(--glass);
        overflow-x: auto;
        scrollbar-width: none;
      }

      body.light .sem-tabs-wrap {
        background: rgba(255, 255, 255, 0.6);
      }

      .sem-tabs-wrap::-webkit-scrollbar {
        display: none;
      }

      .sem-tabs {
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 4px;
        min-width: max-content;
      }

      .sem-tab {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 14px 18px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
        background: transparent;
        border-top: none;
        border-left: none;
        border-right: none;
        cursor: pointer;
        white-space: nowrap;
        transition:
          color 0.2s,
          border-color 0.2s;
        position: relative;
      }

      .sem-tab:hover {
        color: var(--txt);
      }

      .sem-tab.active {
        color: var(--txt);
        border-bottom-color: var(--sem-color, #6366f1);
      }

      .sem-tab .sem-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sem-color, #6366f1);
        box-shadow: 0 0 8px var(--sem-color, #6366f1);
      }

      .sem-tab .note-count {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 1px 6px;
        font-size: 0.68rem;
      }

      .sem-tab.active .note-count {
        background: var(--sem-color, #6366f1);
        color: #fff;
      }

      /* =========================================================
   MAIN CONTENT
========================================================= */
      .main {
        padding: 32px 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Semester header */
      .sem-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 14px;
      }

      .sem-heading {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .sem-num-badge {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Outfit";
        font-size: 1.3rem;
        font-weight: 900;
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .sem-title-block h2 {
        font-family: "Outfit";
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 3px;
      }

      .sem-title-block p {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .sem-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .meta-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
      }

      /* Subject grid */
      .subjects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 16px;
      }

      /* Subject card */
      .sub-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 20px;
        position: relative;
        overflow: hidden;
        backdrop-filter: var(--glass);
        cursor: pointer;
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          border-color 0.25s;
      }

      .sub-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--c, #6366f1);
        border-radius: var(--r) var(--r) 0 0;
      }

      .sub-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
        border-color: var(--c, #6366f1);
      }

      .sub-card-glow {
        position: absolute;
        top: -40px;
        right: -40px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--c, #6366f1);
        opacity: 0.06;
        filter: blur(30px);
        pointer-events: none;
      }

      .sub-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
      }

      .sub-icon {
        font-size: 2rem;
        line-height: 1;
      }

      .sub-code {
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 15px;
        color: var(--c, #6366f1);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid currentColor;
        font-family: "Outfit";
      }

      .sub-name {
        font-family: "Outfit";
        font-size: 1.05rem;
        font-weight: 800;
        margin-bottom: 5px;
        line-height: 1.3;
      }

      .sub-desc {
        font-size: 0.79rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 14px;
      }

      .sub-notes-row {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .note-chip {
        font-size: 0.69rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .note-chip.available {
        color: var(--c, #6366f1);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid currentColor;
      }

      .note-chip.empty {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        opacity: 0.6;
      }

      .sub-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .notes-count {
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 600;
      }

      .notes-count span {
        color: var(--c, #6366f1);
        font-weight: 800;
      }

      .open-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 9px;
        border: 1px solid var(--c, #6366f1);
        background: transparent;
        color: var(--c, #6366f1);
        font-size: 0.77rem;
        font-weight: 700;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .open-btn:hover {
        background: var(--c, #6366f1);
        color: #fff;
      }

      /* Empty subject (no notes yet) */
      .sub-card.no-notes {
        opacity: 0.65;
      }

      .sub-card.no-notes:hover {
        transform: none;
        box-shadow: none;
      }

      /* =========================================================
   NOTES PANEL (slide-over)
========================================================= */
      .panel-backdrop {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      .panel-backdrop.open {
        opacity: 1;
        pointer-events: all;
      }

      .notes-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 201;
        width: min(520px, 100vw);
        background: var(--bg);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      body.light .notes-panel {
        background: #f8faff;
      }

      .notes-panel.open {
        transform: translateX(0);
      }

      .panel-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 20px 22px;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }

      .panel-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 4px;
        background: var(--pc, #6366f1);
      }

      .panel-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        transition: all 0.2s;
      }

      .panel-close:hover {
        background: rgba(255, 255, 255, 0.12);
        color: var(--txt);
      }

      .panel-sub-code {
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--pc, #6366f1);
        margin-bottom: 4px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .panel-sub-name {
        font-family: "Outfit";
        font-size: 1.3rem;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .panel-sub-desc {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
      }

      /* Notes type sections in panel */
      .notes-section {
        margin-bottom: 22px;
      }

      .notes-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--muted);
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .notes-section-title .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pc, #6366f1);
      }

      .note-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 15px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 13px;
        margin-bottom: 8px;
        transition:
          transform 0.2s,
          border-color 0.2s;
        cursor: pointer;
      }

      .note-row:hover {
        transform: translateX(4px);
        border-color: var(--pc, #6366f1);
      }

      .note-row-icon {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        background: rgba(255, 255, 255, 0.05);
      }

      .note-row-info {
        flex: 1;
        min-width: 0;
      }

      .note-row-title {
        font-weight: 700;
        font-size: 0.88rem;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-row-desc {
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .note-row-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .nr-btn {
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 4px;
        border: 1px solid;
        transition: all 0.2s;
      }

      .nr-btn.solid {
        background: var(--pc, #6366f1);
        border-color: var(--pc, #6366f1);
        color: #fff;
      }

      .nr-btn.solid:hover {
        opacity: 0.85;
      }

      .nr-btn.outline {
        background: transparent;
        border-color: var(--border);
        color: var(--muted);
      }

      .nr-btn.outline:hover {
        border-color: var(--pc, #6366f1);
        color: var(--pc, #6366f1);
      }

      /* Empty panel */
      .panel-empty {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
      }

      .panel-empty .pe-icon {
        font-size: 2.5rem;
        margin-bottom: 12px;
        opacity: 0.35;
      }

      .panel-empty h3 {
        font-family: "Outfit";
        font-size: 1.05rem;
        margin-bottom: 6px;
        color: var(--txt);
        opacity: 0.5;
      }

      .panel-empty p {
        font-size: 0.8rem;
        line-height: 1.6;
      }

      .panel-empty code {
        background: rgba(255, 255, 255, 0.07);
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
      }

      /* =========================================================
   READER OVERLAY
========================================================= */
      .reader-overlay {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: none;
        flex-direction: column;
        background: var(--bg);
        animation: rIn 0.25s ease;
      }

      .reader-overlay.open {
        display: flex;
      }

      @keyframes rIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .reader-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        background: rgba(0, 0, 0, 0.55);
        border-bottom: 1px solid var(--border);
        backdrop-filter: var(--glass);
        flex-shrink: 0;
      }

      body.light .reader-bar {
        background: rgba(255, 255, 255, 0.8);
      }

      .reader-back {
        display: flex;

        background: rgba(0, 0, 0, 0.75);

      }

        width: 100%;
        max-width: 600px;
        margin: 0 16px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: var(--r);
        overflow: hidden;
        box-shadow: 0 32px 72px rgba(0, 0, 0, 0.6);
        animation: sbIn 0.25s ease;
      }

      @keyframes sbIn {
        from {
          transform: translateY(-16px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .sb-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .sb-row i {
        color: var(--muted);
      }

      .sb-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--txt);
        font-size: 0.97rem;
        font-family: "Plus Jakarta Sans";
        outline: none;
      }

      .sb-input::placeholder {
        color: var(--muted);
      }

      .sb-esc {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.7rem;
        font-family: monospace;
        cursor: pointer;
      }

      .sb-results {
        max-height: 400px;
        overflow-y: auto;
        padding: 8px;
      }

      .sr-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-radius: 11px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .sr-item:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .sri-icon {
        font-size: 1.1rem;
        width: 28px;
        text-align: center;
        flex-shrink: 0;
      }

      .sri-title {
        font-weight: 700;
        font-size: 0.86rem;
        margin-bottom: 2px;
      }

      .sri-sub {
        font-size: 0.73rem;
        color: var(--muted);
      }

      .sb-empty {
        text-align: center;
        padding: 36px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .sb-hint {
        padding: 10px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 16px;
      }

      .sb-hint-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .sb-hint-item kbd {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-family: monospace;
        font-size: 0.68rem;

========================================================= */
      @media (max-width: 680px) {

          0,
        );
        const subsWithNotes = s.subjects.filter(
          (sub) => sub.notes.length > 0,
        ).length;

        // Recent bar
        const recentHtml = recent.length
          ? `
  <div class="recent-bar">
    <span class="recent-label" style="color:${s.color}">🕐 Recent</span>
    <div class="recent-chips">
      ${recent
        .slice(0, 5)
        .map(
          (r) => `
        <div class="rchip" style="--active-c:${s.color}"
          onclick="openReader('${esc(r.file)}','${r.type}','${esc(r.title)}','${esc(r.sub || "")}')">
          ${r.type === "pdf" ? "📄" : "📖"} ${r.title}
        </div>`,
        )
        .join("")}
    </div>
  </div>`
          : "";

        main.innerHTML = `
  <div class="section-view">
    <div class="sem-header">
      <div class="sem-heading">
        <div class="sem-num-badge" style="background:${s.gradient}">0${s.num}</div>
        <div class="sem-title-block">
          <h2>${s.label}</h2>
          <p>${s.period} · AKU Patna · ${s.subjects.length} Subjects</p>
        </div>
      </div>
      <div class="sem-meta">
        <div class="meta-chip"><i class="fa-solid fa-file-lines" style="color:${s.color}"></i>&nbsp;${totalNotes} Notes</div>
        <div class="meta-chip"><i class="fa-solid fa-book" style="color:${s.color}"></i>&nbsp;${subsWithNotes}/${s.subjects.length} Covered</div>
      </div>
    </div>

    ${recentHtml}

    <div class="subjects-grid">
      ${s.subjects.map((sub, i) => subCard(sub, s.color, i)).join("")}
    </div>
  </div>`;
      }

      function subCard(sub, color, idx) {
        const hasNotes = sub.notes.length > 0;
        const delay = idx * 0.06;
        const chips = sub.notes.length
          ? sub.notes
              .map(
                (n) =>
                  `<span class="note-chip available">${n.type === "pdf" ? "📄" : "📖"} ${n.title}</span>`,
              )
              .join("")
          : `<span class="note-chip empty">📂 No notes yet</span>`;

        return `
  <div class="sub-card${hasNotes ? "" : " no-notes"}"
    style="--c:${color};animation-delay:${delay}s"
    onclick="${hasNotes ? `openPanel(${JSON.stringify(sub).replace(/"/g, "&quot;")},'${color}')` : ""}"
    title="${hasNotes ? "Click to view notes" : "Notes coming soon"}">
    <div class="sub-card-glow"></div>
    <div class="sub-top">
      <div class="sub-icon">${sub.icon}</div>
      <div class="sub-code">${sub.code}</div>
    </div>
    <div class="sub-name">${sub.name}</div>
    <div class="sub-desc">${sub.desc}</div>
    <div class="sub-notes-row">${chips}</div>
    <div class="sub-footer">
      <div class="notes-count">${hasNotes ? `<span>${sub.notes.length}</span> file${sub.notes.length > 1 ? "s" : ""} ready` : "Coming soon"}</div>
      ${
        hasNotes
          ? `<button class="open-btn" onclick="event.stopPropagation();openPanel(${JSON.stringify(sub).replace(/"/g, "&quot;")},'${color}')">
        Open <i class="fa-solid fa-arrow-right" style="font-size:.65rem"></i>
      </button>`
          : `<span style="font-size:.72rem;color:var(--muted)">📁 Empty</span>`
      }
    </div>
  </div>`;
      }

      /* ══════════════════════════════════════════════════════
       NOTES PANEL
    ══════════════════════════════════════════════════════ */
      function openPanel(sub, color) {
        const hdr = document.getElementById("panelHeader");
        const body = document.getElementById("panelBody");

        hdr.style.setProperty("--pc", color);
        hdr.innerHTML = `
    <button class="panel-close" onclick="closePanel()"><i class="fa-solid fa-xmark"></i></button>
    <div class="panel-sub-code">${sub.code}</div>
    <div class="panel-sub-name">${sub.icon} ${sub.name}</div>
    <div class="panel-sub-desc">${sub.desc}</div>`;

        if (!sub.notes.length) {
          body.innerHTML = `
      <div class="panel-empty">
        <div class="pe-icon">📂</div>
        <h3>No notes yet</h3>
        <p>Add files to <code>${sub.code}</code> in the DATA section of <code>notes_hub.html</code>.<br>
        See README.md for instructions.</p>
      </div>`;
        } else {
          // Group by type
          const html = sub.notes.filter((n) => n.type === "html");
          const pdf = sub.notes.filter((n) => n.type === "pdf");

          body.innerHTML = `
      ${
        html.length
          ? `
      <div class="notes-section">
        <div class="notes-section-title" style="--pc:${color}">
          <span class="dot"></span> 📖 HTML Notes <span style="margin-left:auto;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:6px;font-size:.65rem">${html.length}</span>
        </div>
        ${html.map((n) => noteRow(n, sub, color)).join("")}
      </div>`
          : ""
      }
      ${
        pdf.length
          ? `
      <div class="notes-section">
        <div class="notes-section-title" style="--pc:${color}">
          <span class="dot"></span> 📄 PDF Files <span style="margin-left:auto;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:6px;font-size:.65rem">${pdf.length}</span>
        </div>
        ${pdf.map((n) => noteRow(n, sub, color)).join("")}
      </div>`
          : ""
      }`;
        }

        document.getElementById("panelBackdrop").classList.add("open");
        document.getElementById("notesPanel").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function noteRow(note, sub, color) {
        const isPdf = note.type === "pdf";
        return `
  <div class="note-row" style="--pc:${color}"
    onclick="openReader('${esc(note.file)}','${note.type}','${esc(note.title)}','${esc(sub.code + " — " + sub.name)}')">
    <div class="note-row-icon" style="background:${color}18">${isPdf ? "📄" : "📖"}</div>
    <div class="note-row-info">
      <div class="note-row-title">${note.title}</div>
      <div class="note-row-desc">${note.desc || ""}</div>
    </div>
    <div class="note-row-actions">
      <button class="nr-btn solid" onclick="event.stopPropagation();openReader('${esc(note.file)}','${note.type}','${esc(note.title)}','${esc(sub.code + " — " + sub.name)}')">
        <i class="fa-solid fa-${isPdf ? "file-pdf" : "book-open"}"></i> Open
      </button>
      ${
        isPdf
          ? `<a class="nr-btn outline" href="${esc(note.file)}" download onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i></a>`
          : `<button class="nr-btn outline" onclick="event.stopPropagation();window.open('${esc(note.file)}','_blank')"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>`
      }
    </div>
  </div>`;
      }

      function closePanel() {
        document.getElementById("panelBackdrop").classList.remove("open");
        document.getElementById("notesPanel").classList.remove("open");
        document.body.style.overflow = "";
      }

      /* ══════════════════════════════════════════════════════
       READER
    ══════════════════════════════════════════════════════ */
      function openReader(file, type, title, sub) {
        curFile = file;
        document.getElementById("rdTitle").textContent = title;
        document.getElementById("rdSub").textContent = sub || "";
        document.getElementById("readerFrame").src = file;
        document.getElementById("rdDownload").style.display =
          type === "pdf" ? "flex" : "none";
        document.getElementById("readerOverlay").classList.add("open");
        document.body.style.overflow = "hidden";
        saveRecent({ file, type, title, sub });
      }
      function closeReader() {
        document.getElementById("readerOverlay").classList.remove("open");
        document.getElementById("readerFrame").src = "";
        document.body.style.overflow = "";
      }
      function readerFullscreen() {
        const el = document.getElementById("readerOverlay");
        if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      }
      function readerNewTab() {
        if (curFile) window.open(curFile, "_blank");
      }
      function readerDownload() {
        if (!curFile) return;
        const a = document.createElement("a");
        a.href = curFile;
        a.download = curFile.split("/").pop();
        a.click();
      }

      /* ══════════════════════════════════════════════════════
       RECENT
    ══════════════════════════════════════════════════════ */
      function saveRecent(item) {
        recent = recent.filter((r) => r.file !== item.file);
        recent.unshift(item);
        recent = recent.slice(0, 8);
        localStorage.setItem("hub_recent", JSON.stringify(recent));
      }

      /* ══════════════════════════════════════════════════════
       SEARCH
    ══════════════════════════════════════════════════════ */
      function openSearch() {
        document.getElementById("searchModal").classList.add("open");
        document.getElementById("searchResults").innerHTML = "";
        setTimeout(() => document.getElementById("searchInput").focus(), 80);
      }
      function closeSearch() {
        document.getElementById("searchModal").classList.remove("open");
        document.getElementById("searchInput").value = "";
        document.getElementById("searchResults").innerHTML = "";
      }
      function searchBgClick(e) {
        if (e.target === e.currentTarget) closeSearch();
      }
      function searchKeydown(e) {
        if (e.key === "Escape") closeSearch();
      }

      function doSearch(q) {
        const box = document.getElementById("searchResults");
        if (!q.trim()) {
          box.innerHTML = "";
          searchHits = [];
          return;
        }
        const lq = q.toLowerCase();
        searchHits = [];

        SEMESTERS.forEach((s) => {
          s.subjects.forEach((sub) => {
            if (
              sub.name.toLowerCase().includes(lq) ||
              sub.code.toLowerCase().includes(lq) ||
              sub.desc.toLowerCase().includes(lq)
            ) {
              searchHits.push({
                icon: sub.icon,
                title: sub.name,
                meta: `${sub.code} · ${s.label}`,
                kind: "sub",
                sem: s.num,
                color: s.color,
                sub,
              });
            }
            sub.notes.forEach((note) => {
              if (
                note.title.toLowerCase().includes(lq) ||
                (note.desc || "").toLowerCase().includes(lq)
              ) {
                searchHits.push({
                  icon: note.type === "pdf" ? "📄" : "📖",
                  title: note.title,
                  meta: `${sub.code} · ${s.label}`,
                  kind: "note",
                  file: note.file,
                  type: note.type,
                  noteSub: `${sub.code} — ${sub.name}`,
                  color: s.color,
                  sem: s.num,
                  sub,
                });
              }
            });
          });
        });

        if (!searchHits.length) {
          box.innerHTML = '<div class="sb-empty">No results found</div>';
          return;
        }
        box.innerHTML = searchHits
          .slice(0, 10)
          .map(
            (h, i) => `
    <div class="sr-item" onclick="execSearch(${i})">
      <div class="sri-icon">${h.icon}</div>
      <div><div class="sri-title">${h.title}</div><div class="sri-sub">${h.meta}</div></div>
    </div>`,
          )
          .join("");
      }

      function execSearch(idx) {
        const h = searchHits[idx];
        if (!h) return;
        closeSearch();
        if (h.kind === "sub") {
          switchSem(h.sem);
          setTimeout(() => {
            if (h.sub.notes.length) openPanel(h.sub, h.color);
          }, 180);
        } else {
          openReader(h.file, h.type, h.title, h.noteSub);
        }
      }

      /* ══════════════════════════════════════════════════════
       THEME
    ══════════════════════════════════════════════════════ */
      function toggleTheme() {
        document.body.classList.toggle("light");
        const isLight = document.body.classList.contains("light");
        document.getElementById("themeIcon").className = isLight
          ? "fa-solid fa-sun"
          : "fa-solid fa-moon";
        localStorage.setItem("hub_theme", isLight ? "light" : "dark");
      }
      function applyTheme() {
        if (localStorage.getItem("hub_theme") === "light") {
          document.body.classList.add("light");
          document.getElementById("themeIcon").className = "fa-solid fa-sun";
        }
      }

      /* ══════════════════════════════════════════════════════
       UTILS
    ══════════════════════════════════════════════════════ */
      function esc(s) {
        return String(s).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
      }

      function updateTotalLabel() {
        let total = 0;
        SEMESTERS.forEach((s) =>
          s.subjects.forEach((sub) => (total += sub.notes.length)),
        );
        document.getElementById("totalNotesLabel").textContent =
          `${total} Notes Available`;
      }

      /* keyboard shortcuts */
      document.addEventListener("keydown", (e) => {
        const sm = document
          .getElementById("searchModal")
          .classList.contains("open");
        const ro = document
          .getElementById("readerOverlay")
          .classList.contains("open");
        if (e.key === "Escape") {
          if (sm) closeSearch();
          else if (ro) closeReader();
          else closePanel();
        }
        if (
          e.key === "/" &&
          !sm &&
          !ro &&
          document.activeElement.tagName !== "INPUT"
        ) {
          e.preventDefault();
          openSearch();
        }
      });

      /* mobile: show search icon instead of bar */
      if (window.innerWidth <= 680) {
        document.getElementById("mobileSearchBtn").style.display = "flex";
      }
    </script>
  </body>
</html>
