<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>BCA Notes Hub | Sem I–VI | Abdul Rahman</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      /* =========================================================
   ROOT
========================================================= */
      :root {
        --bg: #000;
        --surface: rgba(255, 255, 255, 0.04);
        --surface2: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.14);
        --txt: #fff;
        --muted: #94a3b8;
        --glass: blur(24px);
        --r: 18px;
        --shadow: 0 12px 48px -8px rgba(0, 0, 0, 0.8);
      }

      body.light {
        --bg: #eef2f9;
        --surface: rgba(255, 255, 255, 0.75);
        --surface2: rgba(255, 255, 255, 0.9);
        --border: rgba(0, 0, 0, 0.07);
        --border2: rgba(0, 0, 0, 0.12);
        --txt: #0f172a;
        --muted: #475569;
        --shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: var(--txt);
        min-height: 100vh;
        overflow-x: hidden;
        transition:
          background 0.3s,
          color 0.3s;
        display: flex;
        flex-direction: column;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      /* =========================================================
   SPACE BACKGROUND
========================================================= */
      .space {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(ellipse at 20% 0%, #1a0a3e 0%, #000 50%);
        overflow: hidden;
      }

      body.light .space {
        background: linear-gradient(135deg, #dde6f7 0%, #eef2f9 100%);
      }

      body.light .stars {
        opacity: 0.04;
      }

      body.light .nebula {
        opacity: 0.08;
      }

      .stars {
        position: absolute;
        inset: 0;
        opacity: 0.7;
        background-image:
          radial-gradient(1px 1px at 10% 8%, #fff, transparent),
          radial-gradient(1px 1px at 20% 60%, #fff, transparent),
          radial-gradient(1px 1px at 30% 25%, #aaa, transparent),
          radial-gradient(1px 1px at 42% 80%, #fff, transparent),
          radial-gradient(1px 1px at 55% 15%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 65% 55%, #fff, transparent),
          radial-gradient(1px 1px at 75% 90%, #aaa, transparent),
          radial-gradient(1px 1px at 85% 35%, #fff, transparent),
          radial-gradient(1px 1px at 92% 70%, #fff, transparent),
          radial-gradient(1px 1px at 5% 95%, #fff, transparent),
          radial-gradient(1px 1px at 37% 45%, #aaa, transparent),
          radial-gradient(1px 1px at 50% 50%, #fff, transparent),
          radial-gradient(1px 1px at 78% 12%, #aaa, transparent),
          radial-gradient(1px 1px at 14% 40%, #fff, transparent),
          radial-gradient(1px 1px at 60% 30%, #fff, transparent),
          radial-gradient(1px 1px at 90% 85%, #fff, transparent),
          radial-gradient(1px 1px at 25% 70%, #aaa, transparent),
          radial-gradient(1px 1px at 48% 20%, #fff, transparent),
          radial-gradient(1px 1px at 70% 65%, #fff, transparent),
          radial-gradient(1px 1px at 33% 88%, #aaa, transparent);
        animation: twinkle 8s ease-in-out infinite alternate;
      }

      .nebula {
        position: absolute;
        width: 600px;
        height: 600px;
        top: -100px;
        right: -100px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.18) 0%,
          transparent 70%
        );
        filter: blur(60px);
        animation: nebulaPulse 12s ease-in-out infinite alternate;
      }

      .nebula2 {
        position: absolute;
        width: 400px;
        height: 400px;
        bottom: -50px;
        left: -80px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.12) 0%,
          transparent 70%
        );
        filter: blur(50px);
        animation: nebulaPulse 15s ease-in-out infinite alternate-reverse;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.5;
        }

        100% {
          opacity: 0.9;
        }
      }

      @keyframes nebulaPulse {
        0% {
          transform: scale(1);
        }

        100% {
          transform: scale(1.2);
        }
      }

      /* =========================================================
   HEADER
========================================================= */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.6);
        border-bottom: 1px solid var(--border);
        backdrop-filter: var(--glass);
        -webkit-backdrop-filter: var(--glass);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 64px;
      }

      body.light .header {
        background: rgba(255, 255, 255, 0.75);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Outfit";
        font-size: 1.15rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
      }

      .logo-sub {
        font-size: 0.65rem;
        color: var(--muted);
        font-weight: 600;
        display: block;
        line-height: 1;
      }

      .header-mid {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      /* Search bar in header */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px 16px;
        width: 100%;
        max-width: 380px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .search-bar:hover {
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .search-bar i {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .search-bar span {
        color: var(--muted);
        font-size: 0.85rem;
        flex: 1;
        text-align: left;
      }

      .search-bar kbd {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--border2);
        border-radius: 5px;
        padding: 2px 7px;
        font-size: 0.7rem;
        font-family: monospace;
        color: var(--muted);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Stats pill */
      .stats-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #10b981;
        white-space: nowrap;
      }

      .stats-pill i {
        font-size: 0.7rem;
      }

      /* Icon buttons */
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .icon-btn:hover {
        background: var(--surface2);
        color: var(--txt);
        border-color: var(--border2);
      }

      /* =========================================================
   MAIN CONTENT
========================================================= */
      .main {
        flex: 1;
        padding: 32px 24px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .sem-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 14px;
      }

      .sem-heading {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .sem-num-badge {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Outfit";
        font-size: 1.3rem;
        font-weight: 900;
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .sem-title-block h2 {
        font-family: "Outfit";
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 3px;
      }

      .sem-title-block p {
        font-size: 0.82rem;
        color: var(--muted);
      }

      /* Subject grid */
      .subjects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }

      /* Subject card */
      .sub-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        position: relative;
        overflow: hidden;
        backdrop-filter: var(--glass);
        cursor: pointer;
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          border-color 0.25s;
      }

      .sub-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--c, #6366f1);
        border-radius: 18px 18px 0 0;
      }

      .sub-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
        border-color: var(--c, #6366f1);
      }

      .sub-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
      }

      .sub-icon {
        font-size: 2rem;
        line-height: 1;
      }

      .sub-code {
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 15px;
        color: var(--c, #6366f1);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid currentColor;
        font-family: "Outfit";
      }

      .sub-name {
        font-family: "Outfit";
        font-size: 1.05rem;
        font-weight: 800;
        margin-bottom: 5px;
        line-height: 1.3;
      }

      .sub-desc {
        font-size: 0.79rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 14px;
      }

      .sub-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .notes-count {
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 600;
      }

      .notes-count span {
        color: var(--c, #6366f1);
        font-weight: 800;
      }

      .open-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 9px;
        border: 1px solid var(--c, #6366f1);
        background: transparent;
        color: var(--c, #6366f1);
        font-size: 0.77rem;
        font-weight: 700;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .open-btn:hover {
        background: var(--c, #6366f1);
        color: #fff;
      }

      /* =========================================================
   FOOTER
========================================================= */
      .footer {
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid var(--border);
        padding: 24px;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
        width: 100%;
        margin-top: auto;
      }

      .footer a {
        color: var(--txt);
        font-weight: 600;
        transition: color 0.2s;
      }

      .footer a:hover {
        color: #6366f1;
      }

      body.light .footer {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <div class="space">
      <div class="stars"></div>
      <div class="nebula"></div>
      <div class="nebula2"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">📚</div>
        <div>
          <span style="display: block">BCA Notes Hub</span>
          <span class="logo-sub">Sem I–VI</span>
        </div>
      </div>
      <div class="header-mid">
        <div class="search-bar" onclick="alert('Search functionality coming soon!')">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Search notes, subjects...</span>
          <kbd>/</kbd>
        </div>
      </div>
      <div class="header-right">
        <span class="stats-pill">
          <i class="fa-solid fa-flame"></i> Keep Learning
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <div class="sem-header">
        <div class="sem-heading">
          <div
            class="sem-num-badge"
            style="background: linear-gradient(135deg, #6366f1, #8b5cf6)"
          >
            I–VI
          </div>
          <div class="sem-title-block">
            <h2>Semester Notes Hub</h2>
            <p>All subjects from Year 1–3 · Interactive Learning Platform</p>
          </div>
        </div>
      </div>

      <!-- Subjects Grid -->
      <div class="subjects-grid" id="subjectsGrid"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      © 2026 Abdul Rahman — BCA Student Portal | The Ladder to 2028
    </footer>

    <script>
      // Sample subjects data
      const SUBJECTS = [
        {
          code: "BCA-201",
          name: "Business English",
          icon: "📘",
          color: "#6366f1",
          desc: "Letter writing, comprehension, grammar & communication skills",
        },
        {
          code: "BCA-202",
          name: "Numerical Techniques",
          icon: "🔢",
          color: "#f59e0b",
          desc: "Newton-Raphson, Gauss elimination, numerical integration & interpolation",
        },
        {
          code: "BCA-203",
          name: "System Analysis & Design",
          icon: "🗂️",
          color: "#06b6d4",
          desc: "SDLC models, DFD, ER diagrams, structured system design",
        },
        {
          code: "BCA-204",
          name: "Programming in C",
          icon: "💻",
          color: "#f43f5e",
          desc: "Pointers, structures, file handling, dynamic memory management",
        },
        {
          code: "BCA-205",
          name: "Operating System & UNIX",
          icon: "🖥️",
          color: "#10b981",
          desc: "Process management, deadlock, memory management, shell scripting",
        },
      ];

      // Render subjects grid
      function renderGrid() {
        const grid = document.getElementById("subjectsGrid");
        grid.innerHTML = SUBJECTS.map((s) => `
          <div class="sub-card" style="--c:${s.color}">
            <div class="sub-top">
              <div class="sub-icon">${s.icon}</div>
              <div class="sub-code">${s.code}</div>
            </div>
            <div class="sub-name">${s.name}</div>
            <div class="sub-desc">${s.desc}</div>
            <div class="sub-footer">
              <div class="notes-count">
                0 <span>resources</span>
              </div>
              <button class="open-btn" onclick="alert('Coming soon!')">
                View <i class="fa-solid fa-arrow-right" style="font-size:.65rem"></i>
              </button>
            </div>
          </div>
        `).join("");
      }

      // Initialize on page load
      window.addEventListener("DOMContentLoaded", renderGrid);
    </script>
  </body>
</html>
